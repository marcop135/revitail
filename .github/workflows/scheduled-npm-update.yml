name: Scheduled npm update

on:
  schedule:
    - cron: '0 6 1,15 * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout develop
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.x
          cache: 'npm'

      # Materialize the lockfile tree before updating. Running `npm update` against a bare
      # checkout makes arborist build an ideal tree from nothing, which crashes with
      # "Cannot read properties of null (reading 'edgesOut')" on the npm bundled with
      # Node 22.x (run 32148289066). `npm ci` is the same install ci.yml already performs.
      - name: Install from lockfile
        run: npm ci
        env:
          HUSKY: 0

      - name: Update dependencies within ranges
        run: npm update
        env:
          HUSKY: 0

      - name: Release check (lint, test, build, audit)
        run: npm run release:check
        env:
          HUSKY: 0

      - name: Open pull request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          # PRs opened with the default GITHUB_TOKEN do not trigger workflows, so ci.yml
          # would never run and the required lint-and-test (22.x) check could never pass.
          token: ${{ secrets.RELEASE_PAT }}
          base: develop
          branch: chore/npm-update-${{ github.run_id }}
          title: 'chore(deps): biweekly npm update'
          commit-message: 'chore(deps): npm update'
          body: |
            Automated `npm update` from the biweekly maintenance workflow.

            - Bumps within existing semver ranges only.
            - Verified via `npm run release:check` (lint + vitest + build + audit).
          labels: |
            dependencies
            automated
          delete-branch: true

      # Same PAT as the step above, for the same reason: auto-merge waits on the required
      # lint-and-test (22.x) check, which only fires for a PR opened by a real token. The
      # step is skipped when `npm update` found nothing and no PR was created.
      - name: Enable auto-merge
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
          PR_NUMBER: ${{ steps.cpr.outputs.pull-request-number }}
        run: |
          set -euo pipefail
          # An explicit message keeps GitHub from appending a Co-authored-by trailer for the bot commit.
          gh pr merge --auto --squash --delete-branch \
            --subject "chore(deps): biweekly npm update (#${PR_NUMBER})" \
            --body "Automated npm update within existing semver ranges." \
            "${PR_URL}" || \
            echo "auto-merge already enabled or PR already merged, continuing"
